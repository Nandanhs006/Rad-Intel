[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rad-intel"
version = "0.1.0"
description = "Clinical Decision Support Framework for Automated Pneumonia Detection from Chest Radiographs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "timm>=1.0.29",
    "grad-cam>=1.5.7",
    "lime>=0.2.0.1",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "google-genai>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "reportlab>=5.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "torchxrayvision>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
